[location]
name = METAL SHOP
lat = 32.83475356507972
lon = -96.68858948607502
name_is_custom = false

[display]
range_multiplier = 3
interval_sec = 10
drop_shadow = true
color_scheme = COLORTRAK
all_caps = false
max_tracked = 10
nearest_tracked = 5
trail_length = 8

[airmetal]
# AIR METAL (the 2x2 CRT wall on PRODUCTION) -- the aircraft it's riding
# gets a yellow circle on the radar. Leave empty to turn that off.
url = http://192.168.68.71:8430/riding

[atc]
icao = KDAL
freq = 118.70

[feed]
# Where aircraft come from. On the Pi with the SDR dongle, readsb's own file
# (kept fresh every second); anywhere else the receiver's file over HTTP --
# P4's tar1090. Only a copy reading the local file logs passes, so the
# shared flight log never counts a pass once per screen.
file = /run/readsb/aircraft.json
url = http://192.168.68.70/tar1090/data/aircraft.json
